# ========================================
# Server - LAN Accessibility
# ========================================
server.port=8081
server.address=0.0.0.0
filestorage.base-url=https://192.168.100.85

# ========================================
# Database - PostgreSQL
# ========================================
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:file_storage_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brian}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# File Storage
# ========================================
filestorage.root=uploads

# ========================================
# Multipart File Upload
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ========================================
# Keycloak / OAuth2 Resource Server
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloakuat.abcthebank.com:8099/realms/FileStorage

config.params.keycloak.url=https://keycloakuat.abcthebank.com:8099/realms/FileStorage/protocol/openid-connect/token
config.params.keycloak.client-id=file-storage-client

# ========================================
# Redis
# ========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable Redis Cache in Tests
spring.cache.type=none

# ========================================
# RabbitMQ
# ========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable RabbitMQ Listener in Tests
spring.rabbitmq.listener.simple.auto-startup=false

# RabbitMQ Listener Retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3

# ========================================
# Keycloak HTTP Client
# ========================================

# Connection timeout: 5 seconds
keycloak.http.connect-timeout=5000

# Read timeout: 5 seconds
keycloak.http.read-timeout=5000

# Retry configuration
keycloak.retry.max-attempts=3
keycloak.retry.initial-delay=1000
keycloak.retry.multiplier=2
keycloak.retry.max-delay=4000

# ========================================
# Keycloak Circuit Breaker
# ========================================
keycloak.circuit-breaker.sliding-window-size=10
keycloak.circuit-breaker.minimum-number-of-calls=5
keycloak.circuit-breaker.failure-rate-threshold=50
keycloak.circuit-breaker.wait-duration=10000
keycloak.circuit-breaker.permitted-calls-in-half-open=3

# ========================================
# Spring Boot Actuator Monitoring
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
