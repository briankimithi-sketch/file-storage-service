# ========================================
# Database - PostgreSQL
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/filestorage
spring.datasource.username=postgres
spring.datasource.password=brian
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# File Storage
# ========================================
filestorage.root=uploads

# ========================================
# Multipart File Upload
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ========================================
# Keycloak / OAuth2 Resource Server
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloakuat.abcthebank.com:8099/realms/FileStorage

config.params.keycloak.url=https://keycloakuat.abcthebank.com:8099/realms/FileStorage/protocol/openid-connect/token
config.params.keycloak.client-id=file-storage-client

# ========================================
# Redis
# ========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable Redis Cache in Tests
spring.cache.type=none

# ========================================
# RabbitMQ
# ========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable RabbitMQ Listener in Tests
spring.rabbitmq.listener.simple.auto-startup=false

# RabbitMQ Listener Retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
