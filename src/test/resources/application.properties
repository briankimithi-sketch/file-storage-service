# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/file_storage_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=brian


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate can automatically detect PostgreSQL.
# No need to explicitly specify PostgreSQLDialect.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prevent database queries from being triggered
# during web response rendering.
spring.jpa.open-in-view=false


# ==========================================
# KEYCLOAK
# ==========================================

config.params.keycloak.url=https://keycloakuat.abcthebank.com:8099/realms/RealmName/protocol/openid-connect/token
config.params.keycloak.client-id=file-storage-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloakuat.abcthebank.com:8099/realms/RealmName


# ==========================================
# FILE STORAGE
# ==========================================

filestorage.root=uploads

# Backend URL used to generate file View/Download URLs.
filestorage.base-url=http://localhost:8080
