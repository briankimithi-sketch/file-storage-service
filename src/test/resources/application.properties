# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:file_storage_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brian}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# KEYCLOAK
# ==========================================
config.params.keycloak.url=https://keycloakuat.abcthebank.com:8099/realms/FileStorage/protocol/openid-connect/token
config.params.keycloak.client-id=file-storage-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloakuat.abcthebank.com:8099/realms/FileStorage

# ==========================================
# FILE STORAGE
# ==========================================
filestorage.root=uploads
filestorage.base-url=http://192.168.100.85

# ==========================================
# SERVER / LAN ACCESS
# ==========================================
server.port=8080
server.address=0.0.0.0